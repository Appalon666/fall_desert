<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ядрён-Пустошь</title>
  <!-- Яндекс.Игры SDK (п.1.19.1): подключается отдельным тегом в <head> ДО кода
       игры, как требует документация https://yandex.ru/dev/games/doc/ru/sdk/sdk-about#install
       Игра стартует независимо от результата загрузки скрипта (см. platform/yandex.js). -->
  <script src="https://yandex.ru/games/sdk/v2?days=180"></script>
  <link rel="preload" href="fonts/rubik-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Rubik — самохостинг (variable 400–700), латиница + кириллица. Для Яндекса
       важно: без внешних CDN. Один файл на субсет покрывает все начертания. */
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(fonts/rubik-cyrillic.woff2) format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(fonts/rubik-cyrillic-ext.woff2) format('woff2');
      unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(fonts/rubik-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(fonts/rubik-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Тёплый радиальный фон пустоши — леттербокс на широком мониторе смотрится осмысленно */
      background: radial-gradient(ellipse at 50% 40%, #2a2013 0%, #140f0a 70%, #0b0806 100%);
      font-family: 'Rubik', 'Trebuchet MS', 'Segoe UI', sans-serif;
      touch-action: none;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      /* Мягкая тень по краю холста — отделяет игру от фона */
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
    }
    /* Экран загрузки до старта Phaser: крупный заголовок + видимый прогресс-бар.
       Яндекс 1.14: игрок всегда должен понимать, что игра грузится, а не «висит». */
    #preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #2a2013 0%, #140f0a 70%, #0b0806 100%);
      z-index: 50;
    }
    #preloader .pl-title {
      color: #e8bf3a;
      font-size: clamp(28px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 3px 0 #1a1206, 0 0 26px rgba(201, 162, 39, 0.35);
    }
    #preloader .pl-hint {
      color: #cbb98e;
      font-size: clamp(15px, 2.6vw, 20px);
    }
    #pl-track {
      width: min(560px, 78vw);
      height: 20px;
      border-radius: 10px;
      background: #1a1206;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    #pl-fill {
      width: 4%;
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #5a7a26, #b6f24a);
      transition: width 0.25s ease-out;
    }
    #pl-pct { color: #e8bf3a; font-size: clamp(15px, 2.6vw, 20px); font-weight: 700; }
    /* Экрана «поверни устройство» в игре НЕТ намеренно (Яндекс 1.15): свои
       заглушки о повороте запрещены — ориентация объявлена в консоли
       разработчика (ландшафт), и нужную заглушку рисует сама платформа.
       Игра просто масштабируется под любой размер окна (Phaser Scale.FIT). */
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="preloader">
    <div class="pl-title">Ядрён-Пустошь</div>
    <div id="pl-track"><div id="pl-fill"></div></div>
    <div id="pl-pct">0%</div>
    <div class="pl-hint">Разогреваем дробовик…</div>
  </div>
  <!-- Страховка от «вечного экрана загрузки» (Яндекс 1.14): если модуль игры не
       выполнился (ошибка сети/JS), показываем понятное сообщение с перезагрузкой,
       а не бесконечный прогресс-бар. Инлайн — потому что должно работать даже
       когда основной бандл не загрузился. -->
  <script>
    (function () {
      var shown = false
      function fail(msg) {
        if (shown) return
        shown = true
        var pre = document.getElementById('preloader')
        if (!pre) return
        pre.innerHTML = '<div class="pl-title">Ядрён-Пустошь</div>' +
          '<div class="pl-hint">' + msg + '</div>' +
          '<button id="pl-retry" style="margin-top:8px;padding:14px 28px;' +
          'font:700 18px Rubik,sans-serif;color:#fbf3df;background:#8a4b2a;' +
          'border:2px solid #120d09;border-radius:10px;cursor:pointer">' +
          'Перезагрузить</button>'
        var b = document.getElementById('pl-retry')
        if (b) b.onclick = function () { location.reload() }
      }
      window.addEventListener('error', function (e) {
        var el = e && e.target
        if (!el || el.tagName !== 'SCRIPT') return
        // Упавший SDK Яндекса не фатален — без него игра работает локально.
        if (String(el.src || '').indexOf('yandex.ru/games/sdk') !== -1) return
        fail('Не удалось загрузить игру. Проверь соединение.')
      }, true)
      // Медленная сеть — это нормально, прогресс-бар всё расскажет сам. Ругаемся
      // только если код игры вообще не запустился (window.__ypBooted не выставлен).
      setTimeout(function () {
        var pre = document.getElementById('preloader')
        if (pre && pre.style.display !== 'none' && !window.__ypBooted) {
          fail('Не удалось запустить игру. Попробуй перезагрузить.')
        }
      }, 20000)
    })()
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
